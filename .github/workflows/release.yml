name: release
# Tag vX.Y.Z -> build the library for every PostgreSQL major / CPU / libc, publish tarballs + SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
        libc: [glibc, musl]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker build -f packaging/Dockerfile.${{ matrix.libc }}
          --build-arg PG_MAJOR=${{ matrix.pg }} --target artifact -o dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pg${{ matrix.pg }}-${{ matrix.libc }}-${{ matrix.runner }}
          path: dist/*.tar.gz

  # pg-log-tracer: one static binary per OS/CPU (the no-extension mode for managed databases)
  tracer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: logtrace/go.mod
      - name: Test and cross-compile
        working-directory: logtrace
        run: |
          go test ./...
          v="${GITHUB_REF_NAME#v}"; v="${v:-dev}"
          mkdir -p ../dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$v" -o "pg-log-tracer$ext" .
            if [ "$os" = windows ]; then zip -q "../dist/pg-log-tracer-$v-$os-$arch.zip" "pg-log-tracer$ext"
            else tar -czf "../dist/pg-log-tracer-$v-$os-$arch.tar.gz" "pg-log-tracer"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pg-log-tracer
          path: dist/*

  portability:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*-ubuntu-latest
          merge-multiple: true
          path: dist
      - run: uv run packaging/portability.py dist

  publish:
    needs: [build, tracer, portability]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS install.sh --generate-notes
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: logtrace
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pg-log-tracer:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/pg-log-tracer:latest
