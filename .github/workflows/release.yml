name: release
# Tag vX.Y.Z -> build the library for every PostgreSQL major / CPU / libc, publish tarballs + SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
        libc: [glibc, musl]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker build -f packaging/Dockerfile.${{ matrix.libc }}
          --build-arg PG_MAJOR=${{ matrix.pg }} --target artifact -o dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pg${{ matrix.pg }}-${{ matrix.libc }}-${{ matrix.runner }}
          path: dist/*.tar.gz

  portability:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*-ubuntu-latest
          merge-multiple: true
          path: dist
      - run: uv run packaging/portability.py dist

  publish:
    needs: [build, portability]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS install.sh --generate-notes
