name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Builds the extension against each PostgreSQL major in the official image and
  # runs the end-to-end suite (test/integration.py) inside it.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test --build-arg PG_MAJOR=${{ matrix.pg }} .

  # Real Collector + Flask app using the OpenTelemetry SQL commenter; asserts that
  # PostgreSQL spans are children of the application's client spans.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: examples/demo/run.sh
