name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Builds the extension against each PostgreSQL major in the official image and
  # runs the end-to-end suite (test/integration.py) inside it.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test --build-arg PG_MAJOR=${{ matrix.pg }} .

  # Real Collector + Flask app using the OpenTelemetry SQL commenter; asserts that
  # PostgreSQL spans are children of the application's client spans.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: examples/demo/run.sh

  # pg-log-tracer unit tests (real captured Postgres log text -> parented spans)
  logtrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: logtrace/go.mod
      - run: cd logtrace && go vet ./... && go test ./...

  # Managed-database mode end to end: stock postgres image (no extension) + Collector + pg-log-tracer
  demo-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: examples/demo-managed/run.sh
