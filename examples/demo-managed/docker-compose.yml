name: opentelemetry-postgres-demo-managed
# The managed-database mode: PostgreSQL has NO extension of ours (stock image; imagine RDS).
# Its normal logs -> Collector filelog receiver (stand-in for the awscloudwatch receiver)
# -> pg-log-tracer -> spans parented to the app's psycopg2 client spans.
services:
  postgres:
    image: postgres:17            # unmodified official image
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    command:
      - postgres
      # auto_explain + statement durations: what RDS / Cloud SQL / Azure let you configure
      - -c
      - shared_preload_libraries=auto_explain
      - -c
      - auto_explain.log_min_duration=0
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
      - -c
      - auto_explain.log_timing=off
      - -c
      - log_min_duration_statement=0
      - -c
      - log_timezone=UTC
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d %e "
      - -c
      - logging_collector=on
      - -c
      - log_directory=/pglogs
      - -c
      - log_filename=postgresql.log
      - -c
      - log_file_mode=0644
    volumes:
      - ../demo/init-plain.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./pglogs:/pglogs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      retries: 30

  log-tracer:
    build: ../../logtrace
    command:
      - --listen=:4319
      - "--log-line-prefix=%m [%p] %q%u@%d %e "
      - --service-name=demo-postgres
      - --include-plans
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318

  collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"   # demo only
    depends_on: [log-tracer]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - ./out:/out
      - ./pglogs:/pglogs:ro
    ports:
      - "4318:4318"

  app:
    build: ../demo/app
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:demo@postgres:5432/shop
      OTEL_SERVICE_NAME: demo-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_BSP_SCHEDULE_DELAY: "500"
    ports:
      - "8080:8080"
